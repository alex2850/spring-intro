databaseChangeLog:
  - changeSet:
      id: insert-test-category
      author: Oleksandr
      changes:
        - insert:
            tableName: categories
            columns:
              - column:
                  name: id
                  valueNumeric: 1
              - column:
                  name: name
                  value: Test Category
              - column:
                  name: description
                  value: Description
              - column:
                  name: is_deleted
                  valueBoolean: false